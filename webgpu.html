<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebGPU Ocean 2.5 — 离线版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#e6f7ff;font-family:system-ui}
#canvas{width:100%;height:100%;display:block}
#loader{position:fixed;inset:0;z-index:100;background:#000a14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .6s}
.bar{width:320px;height:4px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden}
.bar div{height:100%;width:0%;background:linear-gradient(90deg,#00d4ff,#00ffaa);transition:width .3s}
#error{font-size:11px;color:#ff9e9e;max-width:560px;white-space:pre-wrap;background:rgba(80,0,0,0.25);padding:8px 12px;border-radius:10px;display:none}
.card{position:fixed;left:14px;top:14px;z-index:10;background:rgba(0,20,35,0.85);border:1px solid rgba(100,200,255,0.2);border-radius:12px;padding:10px 14px;font-size:11px}
.btn{cursor:pointer;background:rgba(20,55,75,0.85);border:1px solid rgba(100,200,255,0.22);color:#cdeeff;padding:4px 8px;border-radius:8px;font-size:11px;margin-right:4px}
.btn.active{background:linear-gradient(135deg,#00d4ff,#00ffaa);color:#001a12}
</style>
<script>
window.__modOK=false;
setTimeout(function(){ if(!window.__modOK){ var e=document.getElementById('error'); if(e){ e.style.display='block'; e.textContent='模块未执行，请用 http://localhost:8000/webgpu.html'; } } }, 4000);
</script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/three-addons/"
  }
}
</script>
<script src="./vendor/es-module-shims.js"></script>
</head>
<body>
<div id="loader">
  <h2>WebGPU Ocean 2.5 离线</h2>
  <div class="bar"><div id="pbar"></div></div>
  <p id="pstatus" style="font-size:11px;color:rgba(180,220,255,0.7)">初始化...</p>
  <p id="error"></p>
  <div><a class="btn" href="/index.html">主版 2.5</a></div>
</div>
<div class="card"><b>WebGPU 2.5 离线</b> · <span id="gpuBadge">检测中</span> · <span id="stats">加载中...</span></div>
<canvas id="canvas"></canvas>
<script type="module">
window.__modOK=true;
const pbar=document.getElementById('pbar'), pstatus=document.getElementById('pstatus'), perr=document.getElementById('error'), gpuBadge=document.getElementById('gpuBadge');
function setProgress(p,m){ pbar.style.width=(p*100)+'%'; if(m) pstatus.textContent=m; }
function setError(m){ perr.style.display='block'; perr.textContent=m; console.error(m); }
window.addEventListener('error', e=> setError(e.message));
window.addEventListener('unhandledrejection', e=> setError(e.reason?.message||e.reason));

(async ()=>{
try{
  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const { ImprovedNoise } = await import('three/addons/math/ImprovedNoise.js');

  const canvas=document.getElementById('canvas');
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a2a4a);
  scene.fog=new THREE.FogExp2(0x87b8d8,0.0012);
  const camera=new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 4000);
  camera.position.set(50,24,65);

  let renderer, isWebGPU=false;
  if(navigator.gpu){
    try{
      gpuBadge.textContent='尝试 WebGPU...';
      const { WebGPURenderer } = await import('three/addons/renderers/webgpu/WebGPURenderer.js');
      const r=new WebGPURenderer({canvas, antialias:true});
      await r.init();
      r.setPixelRatio(Math.min(devicePixelRatio,1.8));
      r.setSize(innerWidth,innerHeight);
      r.toneMapping=THREE.ACESFilmicToneMapping;
      renderer=r; isWebGPU=true;
      gpuBadge.textContent='WebGPU ✓';
      setProgress(0.3,'WebGPU 已启用');
    }catch(e){
      console.warn('WebGPU fail', e);
      gpuBadge.textContent='WebGL2 回退';
    }
  }
  if(!renderer){
    const r=new THREE.WebGLRenderer({canvas, antialias:true});
    r.setPixelRatio(Math.min(devicePixelRatio,1.8));
    r.setSize(innerWidth,innerHeight);
    r.toneMapping=THREE.ACESFilmicToneMapping;
    r.outputColorSpace=THREE.SRGBColorSpace;
    renderer=r;
    gpuBadge.textContent='WebGL2';
    setProgress(0.3,'WebGL2 已启用');
  }

  const sun=new THREE.Vector3(300,400,100);
  const sunLight=new THREE.DirectionalLight(0xffffff,2.8);
  sunLight.position.copy(sun);
  scene.add(sunLight);
  scene.add(new THREE.HemisphereLight(0x8ecbff,0x334455,0.6));

  const noise=new ImprovedNoise();
  function fbm(x,y,oct=3){ let v=0,a=0.5,f=1,max=0; for(let i=0;i<oct;i++){ v+=noise.noise(x*f,y*f,0)*a; max+=a; a*=0.5; f*=2; } return v/max; }

  const oceanParams={time:0, wind:0.9, waveScale:1.0};
  const waves=[{dir:[1,0.3],amp:1.6,freq:0.09,speed:1.3,steep:0.16},{dir:[-0.7,0.8],amp:1.1,freq:0.13,speed:1.0,steep:0.14}];
  function norm2(v){ const l=Math.hypot(v[0],v[1])||1; return [v[0]/l,v[1]/l]; }
  waves.forEach(w=>w.dir=norm2(w.dir));
  function sampleOcean(x,z,time,out={}){ let dx=0,dy=0,dz=0; const ws=oceanParams.waveScale, wind=oceanParams.wind; for(const w of waves){ const k=w.freq*ws, c=w.speed*(1+wind*0.2), A=w.amp*ws*(0.6+wind*0.5), Q=w.steep*wind*1.1; const ph=k*(w.dir[0]*x+w.dir[1]*z)-c*time, s=Math.sin(ph), cc=Math.cos(ph); dx+=Q*A*w.dir[0]*cc; dz+=Q*A*w.dir[1]*cc; dy+=A*s; } out.x=x+dx; out.y=dy; out.z=z+dz; return out; }

  const OCEAN_SIZE=800, OCEAN_RES=140;
  const oceanGeo=new THREE.PlaneGeometry(OCEAN_SIZE,OCEAN_SIZE,OCEAN_RES,OCEAN_RES); oceanGeo.rotateX(-Math.PI/2);
  const oceanOrig=oceanGeo.attributes.position.array.slice();
  const oceanMat=new THREE.MeshPhysicalMaterial({color:0x0a5a7a, roughness:0.2, transparent:true, opacity:0.92, side:THREE.DoubleSide});
  const oceanMesh=new THREE.Mesh(oceanGeo,oceanMat); scene.add(oceanMesh);

  const ISLAND_SIZE=260, ISLAND_RES=80;
  const islandGeo=new THREE.PlaneGeometry(ISLAND_SIZE,ISLAND_SIZE,ISLAND_RES,ISLAND_RES); islandGeo.rotateX(-Math.PI/2);
  const ipos=islandGeo.attributes.position;
  for(let i=0;i<ipos.count;i++){ const x=ipos.getX(i), z=ipos.getZ(i), r=Math.hypot(x,z); let shape=1-THREE.MathUtils.smoothstep(35,120,r); shape*=THREE.MathUtils.smoothstep(0,15,r+5); let h=Math.pow(shape,0.8)*24; if(r>110) h=THREE.MathUtils.lerp(h,-2,THREE.MathUtils.smoothstep(110,130,r)); ipos.setY(i,h); }
  islandGeo.computeVertexNormals();
  scene.add(new THREE.Mesh(islandGeo,new THREE.MeshStandardMaterial({color:0x3d6b2a})));

  const controls=new OrbitControls(camera, renderer.domElement); controls.enableDamping=true; controls.target.set(0,5,0);

  setProgress(1,'完成'); setTimeout(()=>{ document.getElementById('loader').style.opacity='0'; setTimeout(()=>document.getElementById('loader').style.display='none',600); },400);

  let lastTime=performance.now()/1000; const tmp={}; const statsEl=document.getElementById('stats');
  function animate(){
    const now=performance.now()/1000, dt=Math.min(now-lastTime,0.05); lastTime=now; const t=now;
    oceanParams.time=t;
    const pos=oceanGeo.attributes.position;
    for(let i=0;i<pos.count;i++){ const ox=oceanOrig[i*3], oz=oceanOrig[i*3+2]; sampleOcean(ox,oz,t,tmp); pos.setXYZ(i, tmp.x, tmp.y, tmp.z); }
    pos.needsUpdate=true; oceanGeo.computeVertexNormals();
    controls.update();
    if(t%0.5<0.02) statsEl.textContent=`${isWebGPU?'WebGPU':'WebGL2'} · FPS ${(1/dt).toFixed(0)}`;
    renderer.render(scene,camera);
    requestAnimationFrame(animate);
  }
  animate();
  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

}catch(e){ setError('启动失败: '+e.message); }
})();
</script>
</body>
</html>
