<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OceanUnderwater 2.5 Full — 离线版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#00101a;font-family:system-ui}
#canvas{width:100%;height:100%;display:block}
#loader{position:fixed;inset:0;z-index:100;background:#00101a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .6s}
.bar{width:300px;height:4px;background:rgba(255,255,255,0.1);border-radius:99px;overflow:hidden}
.bar div{height:100%;width:0%;background:linear-gradient(90deg,#00d4ff,#00ffaa);transition:width .3s}
#error{font-size:11px;color:#ff9e9e;max-width:500px;white-space:pre-wrap;background:rgba(80,0,0,0.25);padding:8px 12px;border-radius:10px;display:none}
.card{position:fixed;left:14px;top:14px;z-index:10;background:rgba(0,20,35,0.85);border:1px solid rgba(100,200,255,0.2);border-radius:12px;padding:10px 14px;color:#cdeeff;font-size:11px}
.btn{cursor:pointer;background:rgba(20,55,75,0.85);border:1px solid rgba(100,200,255,0.22);color:#cdeeff;padding:4px 8px;border-radius:8px;font-size:11px;margin-right:4px}
.btn.active{background:linear-gradient(135deg,#00d4ff,#00ffaa);color:#001a12}
</style>
<script>
window.__modOK=false;
setTimeout(function(){ if(!window.__modOK){ var e=document.getElementById('error'); if(e){ e.style.display='block'; e.textContent='模块未执行，请用 http://localhost:8000/ocean-full.html 访问，勿 file://'; } } }, 4000);
</script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/three-addons/"
  }
}
</script>
<script src="./vendor/es-module-shims.js"></script>
</head>
<body>
<div id="loader">
  <h2 style="color:#dff8ff">Ocean 2.5 Full 离线</h2>
  <div class="bar"><div id="pbar"></div></div>
  <p id="pstatus" style="font-size:11px;color:rgba(180,220,255,0.7)">初始化...</p>
  <p id="error"></p>
  <div><a class="btn" href="/index.html">主版 2.5</a><a class="btn" href="/webgpu.html">WebGPU版</a></div>
</div>
<div class="card">
  <b>Ocean 2.5 Full</b> 离线版 · <span id="stats">加载中...</span>
  <div style="margin-top:6px"><button class="btn active" id="tgGrass">草</button><button class="btn active" id="tgFish">鱼</button><button class="btn active" id="tgJelly">水母</button><button class="btn" id="tgWire">线框</button></div>
</div>
<canvas id="canvas"></canvas>
<script type="module">
window.__modOK=true;
const pbar=document.getElementById('pbar'), pstatus=document.getElementById('pstatus'), perr=document.getElementById('error');
function setProgress(p,m){ pbar.style.width=(p*100)+'%'; if(m) pstatus.textContent=m; }
function setError(m){ perr.style.display='block'; perr.textContent=m; console.error(m); }
window.addEventListener('error', e=> setError(e.message));
window.addEventListener('unhandledrejection', e=> setError(e.reason?.message||e.reason));

(async ()=>{
try{
  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const { ImprovedNoise } = await import('three/addons/math/ImprovedNoise.js');
  const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
  const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
  const { UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js');
  const { OutputPass } = await import('three/addons/postprocessing/OutputPass.js');

  const canvas=document.getElementById('canvas');
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a2a4a);
  scene.fog=new THREE.FogExp2(0x87b8d8,0.0012);
  const camera=new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 3000);
  camera.position.set(40,22,60);

  const renderer=new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
  renderer.setSize(innerWidth,innerHeight);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled=true;

  const composer=new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.35,0.5,0.8));
  composer.addPass(new OutputPass());

  const sun=new THREE.Vector3(300,400,100);
  const sunLight=new THREE.DirectionalLight(0xffffff,2.8);
  sunLight.position.copy(sun);
  scene.add(sunLight);
  scene.add(new THREE.HemisphereLight(0x8ecbff,0x334455,0.6));

  const noise=new ImprovedNoise();
  function fbm(x,y,oct=3){ let v=0,a=0.5,f=1,max=0; for(let i=0;i<oct;i++){ v+=noise.noise(x*f,y*f,0)*a; max+=a; a*=0.5; f*=2; } return v/max; }

  const oceanParams={time:0, wind:0.9, waveScale:1.0};
  const waves=[{dir:[1,0.3],amp:1.6,freq:0.09,speed:1.3,steep:0.16},{dir:[-0.7,0.8],amp:1.1,freq:0.13,speed:1.0,steep:0.14}];
  function norm2(v){ const l=Math.hypot(v[0],v[1])||1; return [v[0]/l,v[1]/l]; }
  waves.forEach(w=>w.dir=norm2(w.dir));
  function sampleOcean(x,z,time,out={}){ let dx=0,dy=0,dz=0; const ws=oceanParams.waveScale, wind=oceanParams.wind; for(const w of waves){ const k=w.freq*ws, c=w.speed*(1+wind*0.2), A=w.amp*ws*(0.6+wind*0.5), Q=w.steep*wind*1.1; const ph=k*(w.dir[0]*x+w.dir[1]*z)-c*time, s=Math.sin(ph), cc=Math.cos(ph); dx+=Q*A*w.dir[0]*cc; dz+=Q*A*w.dir[1]*cc; dy+=A*s; } out.x=x+dx; out.y=dy; out.z=z+dz; return out; }

  const OCEAN_SIZE=800, OCEAN_RES=140;
  const oceanGeo=new THREE.PlaneGeometry(OCEAN_SIZE,OCEAN_SIZE,OCEAN_RES,OCEAN_RES); oceanGeo.rotateX(-Math.PI/2);
  const oceanMat=new THREE.MeshPhysicalMaterial({color:0x0a5a7a, roughness:0.2, metalness:0.1, transparent:true, opacity:0.92, side:THREE.DoubleSide});
  const oceanMesh=new THREE.Mesh(oceanGeo,oceanMat); scene.add(oceanMesh);
  const oceanOrig=oceanGeo.attributes.position.array.slice();

  const ISLAND_SIZE=260, ISLAND_RES=100;
  const islandGeo=new THREE.PlaneGeometry(ISLAND_SIZE,ISLAND_SIZE,ISLAND_RES,ISLAND_RES); islandGeo.rotateX(-Math.PI/2);
  const ipos=islandGeo.attributes.position;
  const grassSpots=[];
  for(let i=0;i<ipos.count;i++){ const x=ipos.getX(i), z=ipos.getZ(i), r=Math.hypot(x,z); let shape=1-THREE.MathUtils.smoothstep(35,120,r); shape*=THREE.MathUtils.smoothstep(0,15,r+5); shape+=fbm(x*0.02,z*0.02,2)*0.06; shape=THREE.MathUtils.clamp(shape,0,1); let h=Math.pow(shape,0.8)*24 + fbm(x*0.05,z*0.05,3)*3*shape; if(r>110) h=THREE.MathUtils.lerp(h,-2,THREE.MathUtils.smoothstep(110,130,r)); ipos.setY(i,h); if(h>0.5&&h<18&&r<110&&Math.random()<0.6) grassSpots.push({x,z,y:h}); }
  islandGeo.computeVertexNormals();
  const islandMesh=new THREE.Mesh(islandGeo,new THREE.MeshStandardMaterial({color:0x3d6b2a})); scene.add(islandMesh);

  const GRASS_COUNT=20000;
  const bladeGeo=new THREE.PlaneGeometry(0.14,1.0,1,2); bladeGeo.translate(0,0.5,0);
  const gOffsets=[], gScales=[], gRots=[];
  for(let i=0;i<GRASS_COUNT;i++){ const spot=grassSpots[Math.floor(Math.random()*grassSpots.length)]; if(!spot){ gOffsets.push(0,0,0); gScales.push(0); gRots.push(0); continue; } gOffsets.push(spot.x+(Math.random()-0.5)*2, spot.y, spot.z+(Math.random()-0.5)*2); gScales.push(0.5+Math.random()); gRots.push(Math.random()*Math.PI*2); }
  const gInstGeo=new THREE.InstancedBufferGeometry(); gInstGeo.instanceCount=GRASS_COUNT; gInstGeo.setAttribute('position',bladeGeo.attributes.position); gInstGeo.setAttribute('uv',bladeGeo.attributes.uv); gInstGeo.setIndex(bladeGeo.index); gInstGeo.setAttribute('instanceOffset',new THREE.InstancedBufferAttribute(new Float32Array(gOffsets),3)); gInstGeo.setAttribute('instanceScale',new THREE.InstancedBufferAttribute(new Float32Array(gScales),1)); gInstGeo.setAttribute('instanceRot',new THREE.InstancedBufferAttribute(new Float32Array(gRots),1));
  const grassMesh=new THREE.Mesh(gInstGeo,new THREE.MeshStandardMaterial({color:0x2e7a2e, side:THREE.DoubleSide})); scene.add(grassMesh);

  const FISH_COUNT=60; const fishGeo=new THREE.ConeGeometry(0.15,0.6,5); fishGeo.rotateX(-Math.PI/2); const fishInst=new THREE.InstancedMesh(fishGeo,new THREE.MeshStandardMaterial({color:0x66ccff}),FISH_COUNT); const fishData=[]; for(let i=0;i<FISH_COUNT;i++){ const ang=Math.random()*Math.PI*2, rad=30+Math.random()*70; fishData.push({pos:new THREE.Vector3(Math.cos(ang)*rad,-2-Math.random()*10,Math.sin(ang)*rad), vel:new THREE.Vector3((Math.random()-0.5)*1.5,0,(Math.random()-0.5)*1.5)}); } scene.add(fishInst); const fishDummy=new THREE.Object3D();

  const JELLY_COUNT=8; const jellies=[]; for(let i=0;i<JELLY_COUNT;i++){ const col=new THREE.Color().setHSL(0.5+Math.random()*0.4,0.9,0.65); const jelly=new THREE.Mesh(new THREE.SphereGeometry(0.8,16,12,0,Math.PI*2,0,Math.PI*0.6), new THREE.MeshPhysicalMaterial({color:col, emissive:col, emissiveIntensity:0.6, transparent:true, opacity:0.8})); const ang=Math.random()*Math.PI*2, rad=15+Math.random()*60; jelly.position.set(Math.cos(ang)*rad,-6-Math.random()*8,Math.sin(ang)*rad); scene.add(jelly); jellies.push({mesh:jelly, vel:new THREE.Vector3((Math.random()-0.5)*0.2,0,(Math.random()-0.5)*0.2), baseY:jelly.position.y, ph:Math.random()*10}); }

  const controls=new OrbitControls(camera, renderer.domElement); controls.enableDamping=true; controls.target.set(0,5,0);

  document.getElementById('tgGrass').addEventListener('click',e=>{ grassMesh.visible=!grassMesh.visible; e.target.classList.toggle('active',grassMesh.visible); });
  document.getElementById('tgFish').addEventListener('click',e=>{ fishInst.visible=!fishInst.visible; e.target.classList.toggle('active',fishInst.visible); });
  document.getElementById('tgJelly').addEventListener('click',e=>{ const v=!jellies[0].mesh.visible; jellies.forEach(j=>j.mesh.visible=v); e.target.classList.toggle('active',v); });
  document.getElementById('tgWire').addEventListener('click',e=>{ const v=!islandMesh.material.wireframe; islandMesh.material.wireframe=v; oceanMat.wireframe=v; e.target.classList.toggle('active',v); });

  setProgress(1,'完成'); setTimeout(()=>{ document.getElementById('loader').style.opacity='0'; setTimeout(()=>document.getElementById('loader').style.display='none',600); },400);

  let lastTime=performance.now()/1000; const tmp={}; const statsEl=document.getElementById('stats');
  function animate(){
    const now=performance.now()/1000, dt=Math.min(now-lastTime,0.05); lastTime=now; const t=now;
    oceanParams.time=t;
    const pos=oceanGeo.attributes.position;
    for(let i=0;i<pos.count;i++){ const ox=oceanOrig[i*3], oz=oceanOrig[i*3+2]; sampleOcean(ox,oz,t,tmp); pos.setXYZ(i, tmp.x, tmp.y, tmp.z); }
    pos.needsUpdate=true; oceanGeo.computeVertexNormals();
    for(let i=0;i<FISH_COUNT;i++){ const f=fishData[i]; f.pos.add(f.vel.clone().multiplyScalar(dt)); if(f.pos.length()>120) f.vel.add(new THREE.Vector3(-f.pos.x,0,-f.pos.z).normalize().multiplyScalar(0.02)); fishDummy.position.copy(f.pos); const dir=f.vel.clone().normalize(); if(dir.length()>0.001){ fishDummy.lookAt(f.pos.clone().add(dir)); fishDummy.rotateX(Math.PI/2); } fishDummy.updateMatrix(); fishInst.setMatrixAt(i,fishDummy.matrix); }
    fishInst.instanceMatrix.needsUpdate=true;
    for(const j of jellies){ j.mesh.position.add(j.vel.clone().multiplyScalar(dt)); j.mesh.position.y=j.baseY+Math.sin(t*0.6+j.ph)*1.0; }
    controls.update();
    if(t%0.5<0.02) statsEl.textContent=`FPS ${(1/dt).toFixed(0)} · 草${GRASS_COUNT/1000}K 鱼${FISH_COUNT} 水母${JELLY_COUNT}`;
    composer.render();
    requestAnimationFrame(animate);
  }
  animate();
  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); });

}catch(e){ setError('启动失败: '+e.message); }
})();
</script>
</body>
</html>
